interface:
  display_name: "Grill"
  short_description: "Settle a fuzzy design in rounds of questions, each with a recommendation"
  default_prompt: "Use $grill on this idea: build the decision tree, look up every fact yourself, and ask me the whole frontier in one round with your recommended answer for each. Do not write code."
  brand_color: "#1A1A1A"
policy:
  allow_implicit_invocation: true
