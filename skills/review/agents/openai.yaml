interface:
  display_name: "Review"
  short_description: "Shrink the change, review it per area, verify through an integrator, prove no regression"
  default_prompt: "Use $review on this diff: shrink what can be shrunk without changing behavior, review per area, let the integrator verify and run the checks, then tell me whether it is ready to ship."
  brand_color: "#1A1A1A"
policy:
  allow_implicit_invocation: true
