interface:
  display_name: "Review"
  short_description: "Three-lens diff review, filtered to verified findings"
  default_prompt: "Use $review on the exact diff: correctness, over-engineering, and silent-failure safety, then verify each finding against the code and print one line per surviving issue. Baseline: <ref, or leave empty for the branch merge-base>. Add --fix to apply P0-P2 findings, --pr to post one comment after I confirm."
  brand_color: "#D97757"
policy:
  allow_implicit_invocation: true
