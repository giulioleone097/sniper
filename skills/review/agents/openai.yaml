interface:
  display_name: "Review"
  short_description: "Review and fix within scope; delegate only when useful"
  default_prompt: "Use $review on this diff: verify and fix real in-scope defects, remove unnecessary complexity, preserve useful boundaries, then prove the result. Review locally unless independent areas justify subagents."
  brand_color: "#1A1A1A"
policy:
  allow_implicit_invocation: true
